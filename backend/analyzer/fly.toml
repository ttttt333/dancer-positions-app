# ChoreoCore song analyzer (librosa) on Fly.io
# Deploy:
#   cd backend/analyzer
#   fly launch --name choreocore-song-analyzer --region nrt --no-deploy
#   fly deploy
# Then set Supabase Edge secret:
#   npx supabase secrets set ANALYZER_API_URL=https://choreocore-song-analyzer.fly.dev --project-ref <ref>

app = "choreocore-song-analyzer"
primary_region = "nrt"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
